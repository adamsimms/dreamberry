<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Dreamberry — Archive</title>
    <meta name="theme-color" content="#ffffff" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./studio.css" />
  </head>
  <body class="gallery-page" id="page">
    <nav class="nav" aria-label="Studio">
      <a class="brand" href="./index.html" id="brandLink">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">Dreamberry</span>
      </a>
      <p class="nav-meta" id="navMeta">Loading…</p>
    </nav>

    <div class="gallery-days-layout" id="gallery">
      <div
        class="gallery-days-scroll"
        id="daysScroll"
        tabindex="0"
        aria-label="Dream archive by day. Drag or scroll horizontally. Click a frame for the full image."
      >
        <div class="gallery-days-track" id="daysTrack"></div>
      </div>
    </div>

    <main class="viewer" id="viewer" hidden>
      <div class="viewer-stage">
        <button type="button" class="viewer-nav prev" id="prevBtn" aria-label="Previous">
          ‹
        </button>
        <img id="viewerImg" alt="" width="1024" height="768" />
        <button type="button" class="viewer-nav next" id="nextBtn" aria-label="Next">
          ›
        </button>
      </div>
      <aside class="viewer-meta" id="viewerMeta">
        <p class="viewer-kicker" id="viewerKicker"></p>
        <h1 id="viewerTitle"></h1>
        <p class="viewer-sub" id="viewerSub"></p>
        <dl id="viewerDl"></dl>
        <p class="viewer-raw">
          <a id="viewerPng" href="#" target="_blank" rel="noopener">Full PNG</a>
          ·
          <a id="viewerJson" href="#" target="_blank" rel="noopener">Sidecar JSON</a>
          ·
          <a href="./index.html" id="viewerBack">Back to gallery</a>
        </p>
      </aside>
    </main>

    <script src="./studio.js"></script>
  </body>
</html>
